<style>
/* Layout: una columna estrecha. Arriba el nombre del negocio (solo el dueño lo edita). Abajo la ficha del cliente: el dueño marca qué campos se piden, el cliente solo ve y llena los marcados. */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --fg: #14201f;
  --muted: #5a6b69;
  --line: #d6dfde;
  --accent: #0b7a6f;
  --accent-fg: #ffffff;
  --ok: #1c7a3d;
  --warn: #a8540c;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1514; --surface: #162120; --fg: #e8f0ee; --muted: #93a6a3; --line: #283836;
    --accent: #3fc4b3; --accent-fg: #04201c; --ok: #5fd28a; --warn: #f0a766;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1514; --surface: #162120; --fg: #e8f0ee; --muted: #93a6a3; --line: #283836;
  --accent: #3fc4b3; --accent-fg: #04201c; --ok: #5fd28a; --warn: #f0a766;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 680px; margin: 0 auto; display: grid; gap: 20px; }

header { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--font-display); font-size: clamp(28px, 7vw, 40px); line-height: 1.1;
  margin: 0; text-wrap: balance; overflow-wrap: anywhere;
}
h1.pending { color: var(--muted); }

section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 18px; min-width: 0; }
h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }
.lead { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

.field { display: grid; gap: 8px; min-width: 0; }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
label { font-size: 14px; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.pedir { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--accent); cursor: pointer; }
.pedir input { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); }

input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0;
}
textarea { min-height: 88px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, .pedir input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:disabled, textarea:disabled { opacity: .65; cursor: not-allowed; }
input[readonly] { opacity: .85; }

.row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.row input { flex: 1 1 220px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 6px;
  background: var(--accent); color: var(--accent-fg); padding: 10px 18px;
}
button.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 8px 14px; font-size: 14px; }
button:disabled { opacity: .5; cursor: not-allowed; }

.slug { font-size: 13px; color: var(--muted); }
.slug code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); background: var(--bg); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }

.barra { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 12px; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; }
.barra .cuenta { font-size: 13px; color: var(--muted); margin-right: auto; }

.field.off input[type="text"], .field.off textarea, .field.off .imgs { opacity: .55; }
.field.off .pedir { color: var(--muted); }

.imgs { display: flex; flex-wrap: wrap; gap: 10px; }
.imgs figure { margin: 0; position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); max-width: 100%; }
.imgs.logo img { width: 120px; height: 120px; object-fit: contain; display: block; max-width: 100%; }
.imgs.fotos img { width: 110px; height: 110px; object-fit: cover; display: block; }
.imgs.banner figure { width: 100%; }
.imgs.banner img { width: 100%; aspect-ratio: 8 / 3; object-fit: cover; display: block; max-width: 100%; }
.imgs .x { position: absolute; top: 6px; right: 6px; padding: 3px 8px; font-size: 12px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.vacio { margin: 0; font-size: 13px; color: var(--muted); }
.up { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.enlace { font-size: 13px; }
.enlace a { color: var(--accent); }

.aviso { margin: 0; padding: 14px; border-radius: 8px; background: var(--bg); color: var(--muted); font-size: 14px; }

.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.status[data-k="ok"] i { background: var(--ok); }
.status[data-k="ok"] { color: var(--ok); }
.status[data-k="warn"] i { background: var(--warn); }
.status[data-k="warn"] { color: var(--warn); }
.status[data-k="busy"] i { background: var(--accent); }
.banner-t { padding: 12px 16px; border-radius: 10px; background: var(--bg); color: var(--accent); border: 1px solid var(--line); font-size: 13px; font-weight: 600; text-align: center; }
.banner-t.exp { background: #b3261e; color: #fff; border-color: #b3261e; }
.modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-caja { background: var(--surface); color: var(--fg); border: 1px solid var(--accent); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; max-height: 100%; overflow: auto; display: grid; gap: 12px; }
.modal-caja h3 { margin: 0; font-family: var(--font-display); font-size: 16px; }
.modal-caja .chk { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
.modal-caja .chk label { font-weight: 400; display: flex; gap: 6px; align-items: center; }
.modal-caja select, .modal-caja input[type="number"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0; }
.modal-caja textarea { font-family: ui-monospace, monospace; font-size: 12px; min-height: 70px; }
.modal-caja button { width: 100%; }
.modal-caja .row input { flex: 1 1 90px; }
.modal-caja .row button { flex: 1 1 120px; width: auto; }

@media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } }

<main>
  <header>
    <span class="eyebrow">Ficha de tienda online</span>
    <h1 id="titulo" class="pending">Ficha de tienda</h1>
    <p class="sub" id="subtitulo" hidden></p>
  </header>

  <section aria-labelledby="h-negocio" id="sec-negocio" hidden>
    <h2 id="h-negocio">Nuevo negocio</h2>
    <div class="field">
      <label for="nombre">Nombre del negocio</label>
      <div class="row">
        <input id="nombre" type="text" autocomplete="off" placeholder="Ej. Panadería La Espiga" maxlength="80">
        <button id="guardar-nombre" type="button">Guardar negocio</button>
      </div>
      <span class="hint">Solo el nombre. El resto de los datos los llena tu cliente con el enlace que le envíes.</span>
    </div>
  </section>

  <section aria-labelledby="h-cliente" id="sec-cliente">
    <div>
      <h2 id="h-cliente">Ficha del cliente</h2>
      <p class="lead" id="lead"></p>
    </div>

    <div class="banner-t" id="banner-t" hidden></div>

    <div class="barra" id="barra" hidden>
      <span class="cuenta" id="cuenta">Acceso temporal para tu cliente</span>
      <button type="button" id="compartir">🔗 Compartir edición</button>
      <button type="button" class="sec" id="otro">➕ Otro negocio nuevo</button>
    </div>

    <p class="aviso" id="vacio" hidden>Este enlace no tiene campos para editar.</p>

    <div id="lista" style="display:grid;gap:22px"></div>

    <button type="button" id="guardar" hidden>💾 Guardar cambios</button>
    <button type="button" id="previsualizar" hidden>👁️ Previsualizar página</button>

  </section>

  <span class="status" id="estado" data-k="busy" role="status" aria-live="polite"><i></i><span id="estado-txt">Conectando…</span></span>
</main>

<div class="prev-fondo" id="prev-fondo" hidden>
  <div class="prev-caja">
    <div class="prev-head">
      <h2>🌐 Vista Previa - <span id="prev-titulo"></span></h2>
      <button type="button" class="prev-x" id="prev-cerrar" aria-label="Cerrar vista previa">&times;</button>
    </div>
    <iframe id="prev-frame" sandbox="allow-scripts" title="Vista previa de la página publicada"></iframe>
  </div>
</div>

<iframe name="hiddenSaveFrame" style="display:none;"></iframe>

    var dim = maxDim;
    while (dim >= 120) {
      var w = img.width, h = img.height;
      if (w > h && w > dim) { h = Math.round(h * dim / w); w = dim; }
      else if (h >= w && h > dim) { w = Math.round(w * dim / h); h = dim; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      for (var q = calidadIni; q >= 0.2; q -= 0.1) {
        var d = canvas.toDataURL('image/jpeg', q);
        if (d.length <= LIMITE_IMG_CHARS) return d;
      }
      dim = Math.round(dim * 0.8);
    }
    return null;
  }
  function validarArchivoImagen(file) {
    if (!file) return 'No se eligió ningún archivo';
    var t = (file.type || '').toLowerCase();
    if (FILTRO_IMG.tipos.indexOf(t) === -1) {
      var nom = t ? t.split('/').pop().toUpperCase() : 'desconocido';
      return 'Formato no permitido (' + nom + '). Usa JPG, PNG o WEBP.';
    }
    var kb = Math.round(file.size / 1024);
    if (kb < 1) return 'El archivo está vacío o dañado';
    if (kb > FILTRO_IMG.maxOriginalKB) return 'Archivo muy pesado (' + kb + ' KB). Máximo ' + FILTRO_IMG.maxOriginalKB + ' KB.';
    return '';
  }
  function validarMedidasImagen(img, tipo) {
    var min = FILTRO_IMG.minLado[tipo] || 100;
    var lado = tipo === 'banner' ? Math.max(img.width, img.height) : Math.min(img.width, img.height);
    if (lado < min) return 'Imagen muy pequeña (' + img.width + '×' + img.height + ' px). Mínimo ' + min + ' px.';
    return '';
  }

  /* ===== Llamadas al Apps Script (idénticas a index-sencillo) ===== */
  function callAPI(action, params) {
    params = params || {};
    return new Promise(function (resolve, reject) {
      var callbackName = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      var script = document.createElement('script');
      window[callbackName] = function (result) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(result);
      };
      var url = APPS_SCRIPT_URL + '?action=' + action + '&callback=' + callbackName;
      for (var key in params) {
        url += '&' + key + '=' + encodeURIComponent(typeof params[key] === 'object' ? JSON.stringify(params[key]) : params[key]);
      }
      script.src = url;
      script.onerror = function () {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('Error de conexión'));
      };
      document.body.appendChild(script);
    });
  }
  function postViaIframe(action, id, payload) {
    var tokenAdmin = null;
    if (!esCliente) {
      tokenAdmin = getAdminToken();
      if (tokenAdmin === null) return Promise.reject(new Error('CANCELADO'));
    }
    return new Promise(function (resolve, reject) {
      var resuelto = false;
      function onMessage(e) {
        if (resuelto) return;
        if (e.data && typeof e.data === 'object' && 'success' in e.data) {
          resuelto = true;
          window.removeEventListener('message', onMessage);
          resolve(e.data);
        }
      }
      window.addEventListener('message', onMessage);
      $('hf_action').value = action;
      $('hf_id').value = id || '';
      $('hf_datos').value = JSON.stringify(Object.assign({}, payload, esCliente ? { tokenCliente: tokenCliente } : { token: tokenAdmin }));
      var form = $('hiddenSaveForm');
      form.action = APPS_SCRIPT_URL;
      form.submit();
      setTimeout(function () {
        if (!resuelto) { resuelto = true; window.removeEventListener('message', onMessage); reject(new Error('Timeout')); }
      }, 30000);
    });
  }

  /* ===== Construcción de los campos (una sola vez) ===== */
  SECCIONES.forEach(function (sc) {
    var sec = document.createElement("div");
    sec.className = "fsec"; sec.id = "s-" + sc[0]; sec.hidden = true;

    }

function getPlantillaOverridesCSS(plantilla, colorPrimario, colorSecundario, colorAcento) {

    if (!url) return null;

    var m = cleanUrl.match(/^(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    if (/^https:\/\/maps\.app\.goo\.gl\//.test(cleanUrl) || /^https:\/\/goo\.gl\/maps\//.test(cleanUrl)) {

        return extraerCoordsDeUrlLarga(response.url || cleanUrl);

  function extraerCoordsDeUrlLarga(url) {
    var m;

    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    m = url.match(/[?&]q=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    m = url.match(/[?&]ll=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    m = url.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    m = url.match(/(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

    var payload = {
      usuario: nombre.toLowerCase().replace(/\s+/g, "_"),
      password: Math.random().toString(36).substring(2, 10),
      nombre: nombre, slogan: "", descripcion: "", mision: "", mensajeEmergente: "",
      ubicacion: "", direccion: "", latitud: "", longitud: "",
      telefono: "", whatsapp: "", correo: "", horario: "",
      rol: "Admin", urlFacebook: "", Urlexterna: "", activo: true, candado: "abierto",
      fotos: [], logo: "", banner: "", video: "",
      duenoMensaje: "", duenoTelefono: "", duenoCorreo: "",
      colorPrimario: "#7B2FF7", colorSecundario: "#FF00E5", colorAcento: "#00D4FF",
      fuenteLanding: "'Segoe UI',system-ui,sans-serif", plantillaLanding: "futurista"
    };
    setEstado("Guardando…", "busy");
    try {
      var r = await postViaIframe("agregarNegocio", "", payload);
      if (r.success && r.id) {
        negocio = { id: r.id, nombre: nombre };
        $("nombre").disabled = true;
        btn.hidden = true;
        $("subtitulo").textContent = nombre;
        $("subtitulo").hidden = false;
        setEstado("✅ Negocio creado (" + r.id + "). Ahora envía el enlace a tu cliente.", "ok");
        aplicarVisibilidad();
        compartirEdicion();
      } else if (r.success) {
        btn.disabled = false;
        setEstado("⚠️ Se guardó, pero el servidor no devolvió el ID. Búscalo en la lista de index-sencillo y usa Compartir desde ahí.", "warn");
      } else {
        btn.disabled = false;
        setEstado("❌ Error: " + r.error, "warn");
      }
    } catch (e) { btn.disabled = false; setEstado(msgErrorEnvio(e), "warn"); }
  }

  /* ===== Compartir edición (misma lógica que index-sencillo) ===== */
  function cerrarModal(m) { if (m && m.parentNode) m.parentNode.removeChild(m); }
  function modal(html) {
    var m = document.createElement("div");
    m.className = "modal-fondo";
    m.innerHTML = '<div class="modal-caja">' + html + "</div>";
    document.body.appendChild(m);
    m.addEventListener("click", function (e) { if (e.target === m) cerrarModal(m); });
    return m;
  }
  function compartirEdicion() {
    if (esCliente || !negocio) return;
    var checks = GRUPOS.map(function (g) {
      return '<label><input type="checkbox" value="' + g[0] + '"' + (g[2] ? " checked" : "") + "> " + g[1] + "</label>";
    }).join("");
    var m = modal(
      "<h3>🔗 Compartir edición</h3>" +
      "<label>Tiempo de acceso</label>" +
      '<div class="row"><input type="number" id="cantidadTiempo" value="30" min="1">' +
      '<select id="unidadTiempo"><option value="minutos" selected>Minutos</option><option value="horas">Horas</option><option value="dias">Días</option></select></div>' +
      "<label>Campos que podrá editar</label>" +
      '<div class="chk" id="camposCliente">' + checks + "</div>" +
      '<span class="hint" id="avisoLink" role="alert"></span>' +
      '<button type="button" id="btnGenerarLinkCliente">Generar enlace</button>' +
      '<button type="button" class="sec" id="btnCancelarLinkCliente">Cancelar</button>');
    var aviso = m.querySelector("#avisoLink");
    m.querySelector("#btnCancelarLinkCliente").onclick = function () { cerrarModal(m); };
    m.querySelector("#btnGenerarLinkCliente").onclick = async function () {
      var btn = this;
      var cantidad = parseFloat(m.querySelector("#cantidadTiempo").value) || 30;
      var unidad = m.querySelector("#unidadTiempo").value;
      var minutos = Math.round(unidad === "minutos" ? cantidad : unidad === "horas" ? cantidad * 60 : cantidad * 1440);
      var campos = Array.prototype.map.call(m.querySelectorAll("#camposCliente input:checked"), function (c) { return c.value; });
      if (!campos.length) { aviso.textContent = "⚠️ Elige al menos un campo"; return; }
      btn.disabled = true;
      aviso.textContent = "";
      try {
        var r = await postViaIframe("crearTokenCliente", negocio.id, { minutos: minutos, campos: campos });
        if (!r.success) { btn.disabled = false; aviso.textContent = "❌ " + r.error; return; }
        var link = location.origin + location.pathname + "?editarCliente=" + encodeURIComponent(negocio.id) + "&t=" + r.token;
        cerrarModal(m);
        mostrarLink(link, negocio.nombre, cantidad, unidad);
      } catch (e) { btn.disabled = false; aviso.textContent = msgErrorEnvio(e); }
    };
  }
  function mostrarLink(link, nombre, cantidad, unidad) {
    var m = modal(
      "<h3>✅ Enlace generado</h3>" +
      '<span class="hint">Válido por ' + cantidad + " " + unidad + "</span>" +
      '<textarea readonly id="linkGen"></textarea>' +
      '<span class="hint" id="avisoCopia" role="status"></span>' +
      '<div class="row"><button type="button" id="btnCopiarLink">📋 Copiar</button>' +
      '<button type="button" id="btnWhatsappLink">💬 WhatsApp</button></div>' +
      '<button type="button" class="sec" id="btnCerrarLinkModal">Cerrar</button>');
    m.querySelector("#linkGen").value = link;
    m.querySelector("#btnCerrarLinkModal").onclick = function () { cerrarModal(m); };
    m.querySelector("#btnCopiarLink").onclick = async function () {
      try { await navigator.clipboard.writeText(link); m.querySelector("#avisoCopia").textContent = "✅ Enlace copiado"; }
      catch (e) { m.querySelector("#avisoCopia").textContent = "⚠️ No se pudo copiar"; }
    };
    m.querySelector("#btnWhatsappLink").onclick = function () {
      var texto = "Hola" + (nombre ? " " + nombre : "") + ", aquí puedes editar tu negocio: " + link;
      window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
    };
  }

  /* ===== Modo cliente: contador y pantalla expirada ===== */
  function pantallaExpirada() {
    document.body.innerHTML = '<main style="min-height:100vh;align-content:center;text-align:center"><div style="font-size:50px">⏰</div><h2>Enlace no disponible</h2><p class="lead">Este enlace ha expirado.</p></main>';
  }
  function actualizarBannerTiempo() {
    var b = $("banner-t"); if (!b) return;
    var restante = expCliente - Date.now();
    if (restante <= 0) {
      expirado = true;
      b.className = "banner-t exp";
      b.textContent = "⏰ El tiempo expiró";
      document.querySelectorAll("#lista input, #lista textarea, #lista button, #guardar").forEach(function (el) { el.disabled = true; });
      clearInterval(timerBanner);
      DEFS.forEach(function (d) { if (d.t === "img") pintarImgs(d.k); });
      return;
    }
    var minutos = Math.floor(restante / 60000), segundos = Math.floor((restante % 60000) / 1000);
    b.textContent = "⏳ Tiempo restante: " + minutos + "min " + segundos + "seg";
  }

  /* ===== Eventos ===== */
  DEFS.forEach(function (d) {
    if (d.t === "img") {
      $("u-" + d.k).addEventListener("click", function () { $("x-" + d.k).click(); });
      $("x-" + d.k).addEventListener("change", function (ev) {
        var f = ev.target.files;
        if (f && f.length) subir(d.k, f);
        ev.target.value = "";
      });
    }
  });
  $("btnMapaFull").addEventListener("click", abrirMapaPantallaCompleta);
  $("btnUsarLink").addEventListener("click", usarLinkGoogleMaps);
  $("guardar").addEventListener("click", guardar);
  $("previsualizar").addEventListener("click", previsualizar);
  $("prev-cerrar").addEventListener("click", cerrarPreview);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("prev-fondo").hidden) cerrarPreview(); });
  $("compartir").addEventListener("click", compartirEdicion);
  $("guardar-nombre").addEventListener("click", crearNegocio);
  $("nombre").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); crearNegocio(); } });
  $("otro").addEventListener("click", function () { location.reload(); });

  /* ===== Inicio ===== */
  function iniciar() {
    var p = new URLSearchParams(location.search);
    var idCli = p.get("editarCliente");
    if (idCli) {
      esCliente = true;
      tokenCliente = p.get("t") || "";
      if (!tokenCliente) { pantallaExpirada(); return; }
      setEstado("Conectando…", "busy");
      callAPI("clienteGet", { t: tokenCliente }).then(function (r) {
        if (!r.success || !r.negocio || r.negocio.id !== idCli) { pantallaExpirada(); return; }
        expCliente = Number(r.exp);
        camposCliente = Array.isArray(r.campos) ? r.campos : String(r.campos || "").split(",");
        cargarEnForm(r.negocio);
        $("banner-t").hidden = false;
        actualizarBannerTiempo();
        timerBanner = setInterval(actualizarBannerTiempo, 30000);
        if (!expirado) setEstado("Listo. Presiona Guardar cambios al terminar.", "ok");
        if (enMarco()) setEstado("⚠️ Esta ficha está abierta dentro de otra página (vista previa). Ahí no puede guardar ni compartir: ábrela desde tu hosting, en su propia pestaña.", "warn");
      }).catch(function () { pantallaExpirada(); });
      return;
    }
    aplicarVisibilidad();
    $("titulo").textContent = "➕ Nuevo Negocio";
    $("titulo").className = "";
    setEstado("Escribe el nombre del negocio y presiona Guardar negocio.", "ok");
    if (enMarco()) setEstado("⚠️ Esta ficha está abierta dentro de otra página (vista previa). Ahí no puede guardar ni compartir: ábrela desde tu hosting, en su propia pestaña.", "warn");
  }
  iniciar();
})();
</script>

</body></html>
