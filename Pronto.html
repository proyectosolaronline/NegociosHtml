<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Chela Pronto 🍻</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --oro:#f5a623; --oro2:#ffc857; --bg:#0a0a0a; --card:#161616;
    --card-on:#221c0d; --borde:#242424; --txt:#fff; --txt2:#8a8a8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .pantalla{
    display:none;min-height:100vh;padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;animation:fade .35s ease;
  }
  .pantalla.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* PANTALLA 1 */
  #p1{display:flex;flex-direction:column;justify-content:center;text-align:center}
  #p1 .logo{font-size:56px;margin-bottom:8px}
  #p1 h1{
    font-size:34px;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--oro),var(--oro2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  #p1 .msg{color:var(--txt2);font-size:15px;line-height:1.5;margin:14px 0 20px}
  #p1 .msg b{color:var(--txt)}
  #map{height:300px;width:100%;border-radius:18px;background:#1a1a1a;
       border:1px solid var(--borde);overflow:hidden}
  .btn{
    width:100%;padding:17px;border:none;border-radius:14px;
    font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;
    transition:transform .1s,opacity .2s;
  }
  .btn:active{transform:scale(.98)}
  .btn-oro{background:linear-gradient(135deg,var(--oro),var(--oro2));color:#000}
  .btn-oro:disabled{background:#1c1c1c;color:#555;cursor:not-allowed}
  .btn-mt{margin-top:18px}

  /* PANTALLA 2 */
  #header{
    position:sticky;top:0;z-index:100;background:rgba(10,10,10,.95);
    backdrop-filter:blur(10px);padding:14px 0 16px;
    border-bottom:1px solid var(--borde);margin-bottom:18px;
  }
  #header .estado{font-size:13px;color:var(--txt2);letter-spacing:.5px;text-transform:uppercase}
  #header .total{font-size:32px;font-weight:800;color:var(--oro);margin-top:2px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{
    background:var(--card);border:1px solid var(--borde);border-radius:16px;
    padding:14px;display:flex;flex-direction:column;justify-content:space-between;
    transition:.2s;
  }
  .card.on{border-color:var(--oro);background:var(--card-on);box-shadow:0 0 0 1px var(--oro) inset}
  .card h3{font-size:15px;font-weight:700;margin-bottom:2px}
  .card small{font-size:11px;color:var(--txt2);display:block;margin-bottom:10px;line-height:1.3;min-height:28px}
  .card .precio{color:var(--oro);font-weight:800;font-size:19px}
  .ctrl{display:flex;align-items:center;justify-content:space-between;
        margin-top:12px;background:#000;border-radius:10px;padding:4px}
  .ctrl button{
    width:32px;height:32px;border-radius:8px;border:none;
    background:linear-gradient(135deg,var(--oro),var(--oro2));color:#000;
    font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;
    transition:transform .1s;
  }
  .ctrl button:active{transform:scale(.9)}
  .ctrl button:disabled{background:#222;color:#555;cursor:not-allowed}
  .ctrl span{font-weight:800;font-size:16px;min-width:20px;text-align:center}

  #form{display:none;margin-top:20px;background:var(--card);
        border:1px solid var(--borde);border-radius:16px;padding:18px}
  #form h3{margin-bottom:12px;font-size:17px}
  .input{
    width:100%;padding:13px;margin:6px 0;border-radius:12px;
    border:1px solid var(--borde);background:#000;color:#fff;
    font-size:16px;font-family:inherit;
  }
  .input:focus{outline:none;border-color:var(--oro)}
</style>
</head>
<body>

<!-- PANTALLA 1: MAPA -->
<div id="p1" class="pantalla on">
  <div class="logo">🍻</div>
  <h1>Chela Pronto</h1>
  <p class="msg">Para que Chela Pronto llegue <b>pronto</b> a tu domicilio,<br>activa tu ubicación en el mapa. 📍</p>
  <div id="map"></div>
  <button class="btn btn-oro btn-mt" id="btnOk" disabled>📍 Toca el mapa para ubicarte</button>
</div>

<!-- PANTALLA 2: PEDIDO -->
<div id="p2" class="pantalla">
  <div id="header">
    <div class="estado">Solicitando pedido 🍺</div>
    <div class="total">Total: <span id="total">$0</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <button class="btn btn-oro btn-mt" onclick="abrirForm()">Pedir 🍺</button>

  <div id="form">
    <h3>Datos de entrega</h3>
    <input class="input" id="nombre" type="text" placeholder="Tu nombre">
    <input class="input" id="direccion" type="text" placeholder="Calle y número (referencia)">
    <input class="input" id="telefono" type="tel" placeholder="WhatsApp">
    <button class="btn btn-oro btn-mt" onclick="enviar()">Confirmar pedido 🍻</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WA = "52TUNUMERO";
const PRODUCTOS = [
  { id:'six',     nombre:'Six Pack', desc:'Cerveza fría, lista para llevar', precio:120, min:1 },
  { id:'ocho',    nombre:'8 Pack',   desc:'Ocho cervezas bien frías',        precio:150, min:1 },
  { id:'caguama', nombre:'Caguama',  desc:'Litrote bien frío',               precio:45,  min:2 },
  { id:'bazuka',  nombre:'Bazuka',   desc:'Caguama de 1.2L',                 precio:65,  min:2 }
];

const cant = {};
const $ = id => document.getElementById(id);
let mapa, pin, ubic = "";

/* === RENDER PRODUCTOS === */
$('grid').innerHTML = PRODUCTOS.map(p => `
  <div class="card" id="c-${p.id}">
    <div>
      <h3>${p.nombre}</h3>
      <small>${p.desc}</small>
      <div class="precio">$${p.precio}</div>
    </div>
    <div class="ctrl">
      <button onclick="cambiar('${p.id}',-1)" id="m-${p.id}" disabled>−</button>
      <span id="v-${p.id}">0</span>
      <button onclick="cambiar('${p.id}',1)">+</button>
    </div>
  </div>
`).join('');

/* === MAPA === */
function initMapa(){
  if (typeof L === 'undefined'){
    $('map').innerHTML = '<div style="padding:20px;text-align:center;color:#f5a623">⚠️ No cargó el mapa. Revisa tu conexión.</div>';
    return;
  }
  mapa = L.map('map', {zoomControl:false}).setView([19.4326,-99.1332],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(mapa);
  setTimeout(()=>mapa.invalidateSize(),400);

  mapa.on('click', e=>{
    const {lat,lng} = e.latlng;
    ubic = `https://maps.google.com/?q=${lat},${lng}`;
    if (pin) mapa.removeLayer(pin);
    pin = L.marker([lat,lng]).addTo(mapa);
    const b = $('btnOk');
    b.disabled = false;
    b.innerText = '✅ Esta es mi ubicación';
  });

  navigator.geolocation?.getCurrentPosition(
    p => mapa.setView([p.coords.latitude,p.coords.longitude],16),
    ()=>{}, {enableHighAccuracy:true,timeout:8000}
  );
}

/* === CONFIRMAR UBICACIÓN === */
$('btnOk').onclick = ()=>{
  if (!ubic) return alert('Toca el mapa para marcar tu ubicación');
  $('p1').classList.remove('on');
  $('p2').classList.add('on');
  window.scrollTo(0,0);
};

/* === CARRITO === */
function cambiar(id, d){
  const p = PRODUCTOS.find(x=>x.id===id);
  const n = Math.max(0, (cant[id]||0) + d);
  cant[id] = n;
  $('v-'+id).innerText = n;
  $('m-'+id).disabled = n===0;
  $('c-'+id).classList.toggle('on', n>0);
  pintarTotal();
}

function totalCalc(){
  return PRODUCTOS.reduce((s,p)=> s + (cant[p.id]||0)*p.precio, 0);
}

function pintarTotal(){
  $('total').innerText = '$' + totalCalc();
}

/* === FORM === */
function abrirForm(){
  const t = totalCalc();
  if (!t) return alert('Elige al menos un producto');
  for (const p of PRODUCTOS){
    const c = cant[p.id]||0;
    if (c>0 && c<p.min) return alert(`${p.nombre} mínimo ${p.min}`);
  }
  $('form').style.display = 'block';
  $('form').scrollIntoView({behavior:'smooth'});
}

/* === ENVIAR === */
function enviar(){
  const nombre = $('nombre').value.trim();
  const dir    = $('direccion').value.trim();
  const tel    = $('telefono').value.trim();
  if (!nombre || !dir || !tel) return alert('Llena tus datos de entrega');

  let txt = '🍻 Pedido Chela Pronto\n\n';
  for (const p of PRODUCTOS){
    const c = cant[p.id]||0;
    if (c) txt += `${p.nombre}: ${c} ($${c*p.precio})\n`;
  }
  txt += `\n💰 Total: $${totalCalc()}`;
  txt += `\n\n👤 ${nombre}\n📍 ${dir}\n📱 ${tel}`;
  if (ubic) txt += `\n🗺️ ${ubic}`;

  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(txt)}`,'_blank');
}

/* === INICIO === */
window.addEventListener('load', ()=> setTimeout(initMapa, 300));
</script>
</body>
</html>
