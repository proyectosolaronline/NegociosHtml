<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Negocios</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
    .container { max-width: 1400px; margin: 0 auto; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 30px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 26px; font-weight: 600; }
    .header-actions { display: flex; gap: 12px; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5a6fd6; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    .btn-warning { background: #ffc107; color: #333; }
    .btn-outline { background: transparent; border: 2px solid white; color: white; }
    .btn-outline:hover { background: white; color: #667eea; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: white; padding: 18px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .stat-card .number { font-size: 28px; font-weight: 700; color: #667eea; }
    .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .search-box input { flex: 1; max-width: 400px; padding: 10px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
    .search-box input:focus { outline: none; border-color: #667eea; }
    .negocios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
    .negocio-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .negocio-header { padding: 16px 20px; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e9ecef; }
    .negocio-header .id { font-size: 12px; color: #888; font-weight: 600; }
    .negocio-header .status { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .status-active { background: #d4edda; color: #155724; }
    .status-inactive { background: #f8d7da; color: #721c24; }
    .negocio-body { padding: 16px 20px; }
    .negocio-body .nombre { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .negocio-body .slogan { font-size: 14px; color: #667eea; font-weight: 500; }
    .negocio-body .descripcion { font-size: 14px; color: #555; margin: 10px 0 12px 0; line-height: 1.5; }
    .info-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; margin: 4px 0; }
    .info-row .icon { font-size: 16px; width: 20px; text-align: center; }
    .fotos-preview { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .fotos-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid #e9ecef; cursor: pointer; }
    .negocio-footer { padding: 12px 20px; border-top: 1px solid #e9ecef; display: flex; gap: 8px; flex-wrap: wrap; background: #fafafa; }
    .negocio-footer .btn { flex: 1; min-width: 80px; padding: 8px 12px; font-size: 12px; justify-content: center; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; padding: 20px; }
    .modal.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-content { background: white; max-width: 750px; width: 100%; border-radius: 16px; padding: 30px; margin-top: 30px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 22px; }
    .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #999; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #444; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; border-top: 1px solid #e9ecef; padding-top: 20px; }
    .fotos-section { border: 1px solid #e9ecef; border-radius: 10px; padding: 16px; margin: 16px 0; background: #fafafa; }
    .fotos-section h3 { font-size: 15px; margin-bottom: 12px; color: #444; }
    .foto-slot { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed #e0e0e0; }
    .foto-slot:last-child { border-bottom: none; }
    .foto-slot .preview { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 2px solid #e0e0e0; background: #eee; flex-shrink: 0; }
    .foto-slot .foto-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .foto-slot input[type="file"] { font-size: 12px; }
    .foto-slot input[type="text"] { padding: 6px 10px; font-size: 13px; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 30px; right: 30px; padding: 16px 28px; border-radius: 10px; color: white; font-weight: 600; z-index: 2000; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .toast-success { background: #28a745; }
    .toast-error { background: #dc3545; }
    .empty-state { text-align: center; padding: 60px 20px; color: #888; grid-column: 1/-1; }
    .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
    @media (max-width: 768px) {
      .header { flex-direction: column; text-align: center; }
      .form-row { grid-template-columns: 1fr; }
      .negocios-grid { grid-template-columns: 1fr; }
      .search-box input { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <h1>🏪 Gestión de Negocios</h1>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="cargarNegocios()">🔄 Recargar</button>
        <button class="btn btn-success" onclick="abrirModalAgregar()">➕ Nuevo Negocio</button>
      </div>
    </div>

    <div class="stats-grid" id="stats"></div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar negocio..." oninput="filtrarNegocios()">
      </div>
      <span id="contador" style="font-size:14px;color:#888;"></span>
    </div>

    <div id="negociosGrid" class="negocios-grid">
      <div class="loading"><div class="spinner"></div><p>Cargando negocios...</p></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo Negocio</h2>
        <button class="modal-close" onclick="cerrarModal()">&times;</button>
      </div>
      <form id="formNegocio" onsubmit="guardarNegocio(event)">
        <input type="hidden" id="editId" value="">

        <div class="form-row">
          <div class="form-group"><label>Usuario *</label><input type="text" id="usuario" required></div>
          <div class="form-group"><label>Contraseña *</label><input type="password" id="password" required></div>
        </div>

        <div class="form-group"><label>Nombre *</label><input type="text" id="nombre" required></div>
        <div class="form-group"><label>Slogan</label><input type="text" id="slogan"></div>
        <div class="form-group"><label>Descripción</label><textarea id="descripcion"></textarea></div>

        <div class="form-row">
          <div class="form-group"><label>Ubicación</label><input type="text" id="ubicacion"></div>
          <div class="form-group"><label>Dirección</label><input type="text" id="direccion"></div>
        </div>

        <div class="form-row">
          <div class="form-group"><label>Teléfono</label><input type="text" id="telefono"></div>
          <div class="form-group"><label>WhatsApp</label><input type="text" id="whatsapp"></div>
        </div>

        <div class="form-row">
          <div class="form-group"><label>Correo</label><input type="email" id="correo"></div>
          <div class="form-group"><label>Horario</label><input type="text" id="horario" placeholder="Ej: 9:00 a 6"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Rol</label>
            <select id="rol"><option value="Admin">Admin</option><option value="Usuario">Usuario</option><option value="Supervisor">Supervisor</option></select>
          </div>
          <div class="form-group"><label>URL Facebook</label><input type="text" id="urlFacebook" placeholder="https://facebook.com/..."></div>
        </div>

        <div class="form-group">
          <label>Activo</label>
          <select id="activo"><option value="true">Sí</option><option value="false">No</option></select>
        </div>

        <div class="fotos-section">
          <h3>📸 Fotos del negocio (hasta 4)</h3>
          <div id="fotosContainer"></div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-warning" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardar">💾 Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let negocios = [];
    let fotosActuales = [null, null, null, null]; // {url, descripcion} o null

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    window.onload = function () {
      console.log('✅ Página cargada - Inicializando...');
      renderizarSlotsFotos();
      cargarNegocios();
    };

    // ============================================================
    // CARGA Y RENDER DE NEGOCIOS
    // ============================================================
    function cargarNegocios() {
      const grid = document.getElementById('negociosGrid');
      grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando negocios...</p></div>';

      console.log('📡 Llamando a google.script.run.obtenerNegocios()...');
      
      google.script.run
        .withSuccessHandler(function (result) {
          console.log('✅ Respuesta recibida:', result);
          
          if (!result.success) {
            console.error('❌ Error del servidor:', result.error);
            mostrarToast('Error al cargar: ' + result.error, 'error');
            grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Error al cargar los negocios: ' + result.error + '</p></div>';
            return;
          }
          
          negocios = result.negocios || [];
          console.log('📊 Negocios cargados:', negocios.length);
          renderizarNegocios();
          actualizarEstadisticas();
        })
        .withFailureHandler(function (error) {
          console.error('❌ Error de conexión:', error);
          mostrarToast('Error de conexión: ' + error.message, 'error');
          grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Error de conexión: ' + error.message + '</p></div>';
        })
        .obtenerNegocios();
    }

    function renderizarNegocios() {
      const grid = document.getElementById('negociosGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      const filtrados = negocios.filter(function (n) {
        return (n.nombre || '').toLowerCase().includes(searchTerm) ||
          (n.id || '').toLowerCase().includes(searchTerm) ||
          (n.slogan || '').toLowerCase().includes(searchTerm) ||
          (n.direccion || '').toLowerCase().includes(searchTerm);
      });

      document.getElementById('contador').textContent = filtrados.length + ' de ' + negocios.length + ' negocios';

      if (filtrados.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No se encontraron negocios</p>' +
          '<button class="btn btn-primary" style="margin-top:12px;" onclick="abrirModalAgregar()">➕ Crear uno</button></div>';
        return;
      }

      grid.innerHTML = filtrados.map(function (n) {
        const fotosHtml = (n.fotos && n.fotos.length > 0) ? (
          '<div class="fotos-preview">' +
          n.fotos.slice(0, 4).map(function (f) {
            return '<img src="' + f.url + '" title="' + (f.descripcion || '') + '" onclick="window.open(\'' + f.url + '\')">';
          }).join('') +
          '</div>'
        ) : '';

        return '<div class="negocio-card">' +
          '<div class="negocio-header">' +
          '<span class="id">' + (n.id || 'Sin ID') + '</span>' +
          '<span class="status ' + (n.activo ? 'status-active' : 'status-inactive') + '">' + (n.activo ? '✅ Activo' : '❌ Inactivo') + '</span>' +
          '</div>' +
          '<div class="negocio-body">' +
          '<div class="nombre">' + (n.nombre || 'Sin nombre') + '</div>' +
          '<div class="slogan">' + (n.slogan || '') + '</div>' +
          '<div class="descripcion">' + (n.descripcion || '') + '</div>' +
          '<div class="info-row"><span class="icon">📍</span> ' + (n.direccion || 'Sin dirección') + '</div>' +
          '<div class="info-row"><span class="icon">📞</span> ' + (n.telefono || 'Sin teléfono') + '</div>' +
          '<div class="info-row"><span class="icon">⏰</span> ' + (n.horario || 'Sin horario') + '</div>' +
          '<div class="info-row"><span class="icon">👤</span> ' + (n.rol || 'Sin rol') + ' | ' + (n.usuario || 'Sin usuario') + '</div>' +
          fotosHtml +
          '</div>' +
          '<div class="negocio-footer">' +
          '<button class="btn btn-primary" onclick="abrirModalEditar(\'' + n.id + '\')">✏️ Editar</button>' +
          '<button class="btn btn-danger" onclick="eliminarNegocio(\'' + n.id + '\')">🗑️ Eliminar</button>' +
          '</div></div>';
      }).join('');
    }

    function filtrarNegocios() { 
      renderizarNegocios(); 
    }

    // ============================================================
    // ESTADÍSTICAS
    // ============================================================
    function actualizarEstadisticas() {
      console.log('📡 Solicitando estadísticas...');
      
      google.script.run
        .withSuccessHandler(function (result) {
          console.log('✅ Estadísticas recibidas:', result);
          
          if (!result.success) {
            console.error('❌ Error en estadísticas:', result.error);
            return;
          }
          
          const s = result.estadisticas;
          document.getElementById('stats').innerHTML =
            '<div class="stat-card"><div class="number">' + s.total + '</div><div class="label">Total Negocios</div></div>' +
            '<div class="stat-card"><div class="number">' + s.activos + '</div><div class="label">Activos</div></div>' +
            '<div class="stat-card"><div class="number">' + s.inactivos + '</div><div class="label">Inactivos</div></div>' +
            '<div class="stat-card"><div class="number">' + s.ubicacionesUnicas + '</div><div class="label">Ubicaciones Únicas</div></div>';
        })
        .withFailureHandler(function (error) {
          console.error('❌ Error al obtener estadísticas:', error);
        })
        .obtenerEstadisticas();
    }

    // ============================================================
    // SLOTS DE FOTOS (en el modal)
    // ============================================================
    function renderizarSlotsFotos() {
      const cont = document.getElementById('fotosContainer');
      cont.innerHTML = '';
      
      for (let i = 0; i < 4; i++) {
        const foto = fotosActuales[i];
        const slot = document.createElement('div');
        slot.className = 'foto-slot';
        slot.innerHTML =
          '<img class="preview" id="preview' + i + '" src="' + (foto ? foto.url : '') + '" ' +
          'style="' + (foto ? '' : 'display:none;') + '" ' +
          'onerror="this.style.display=\'none\'">' +
          '<div class="foto-fields">' +
          '<input type="file" accept="image/*" onchange="onFotoSeleccionada(' + i + ', this)">' +
          '<input type="text" placeholder="Descripción de la foto" id="descFoto' + i + '" ' +
          'value="' + (foto ? (foto.descripcion || '') : '') + '" ' +
          'oninput="actualizarDescFoto(' + i + ', this.value)">' +
          (foto ? '<button type="button" class="btn btn-danger btn-sm" style="width:fit-content;" onclick="quitarFoto(' + i + ')">Quitar foto</button>' : '') +
          '</div>';
        cont.appendChild(slot);
      }
    }

    function onFotoSeleccionada(index, input) {
      const file = input.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function (e) {
        const base64Data = e.target.result;
        mostrarToast('⏳ Subiendo foto...', 'success');
        
        console.log('📤 Subiendo foto ' + (index + 1) + ': ' + file.name);
        
        google.script.run
          .withSuccessHandler(function (result) {
            console.log('✅ Respuesta de subida:', result);
            
            if (result.success) {
              // Mantener la descripción si ya existía
              const descActual = fotosActuales[index] ? fotosActuales[index].descripcion : '';
              fotosActuales[index] = { url: result.url, descripcion: descActual };
              renderizarSlotsFotos();
              mostrarToast('✅ Foto ' + (index + 1) + ' subida correctamente', 'success');
            } else {
              console.error('❌ Error al subir foto:', result.error);
              mostrarToast('Error al subir foto: ' + result.error, 'error');
            }
          })
          .withFailureHandler(function (error) {
            console.error('❌ Error de conexión al subir foto:', error);
            mostrarToast('Error: ' + error.message, 'error');
          })
          .subirFoto(base64Data, file.name, file.type);
      };
      reader.readAsDataURL(file);
    }

    function actualizarDescFoto(index, valor) {
      if (fotosActuales[index]) {
        fotosActuales[index].descripcion = valor;
      }
    }

    function quitarFoto(index) {
      fotosActuales[index] = null;
      renderizarSlotsFotos();
    }

    // ============================================================
    // MODAL
    // ============================================================
    function abrirModalAgregar() {
      console.log('📝 Abriendo modal para NUEVO negocio');
      
      document.getElementById('modalTitle').textContent = '➕ Nuevo Negocio';
      document.getElementById('btnGuardar').textContent = '💾 Guardar';
      document.getElementById('editId').value = '';
      document.getElementById('formNegocio').reset();
      document.getElementById('activo').value = 'true';
      document.getElementById('rol').value = 'Admin';
      fotosActuales = [null, null, null, null];
      renderizarSlotsFotos();
      document.getElementById('modal').classList.add('active');
    }

    function abrirModalEditar(id) {
      console.log('✏️ Abriendo modal para EDITAR negocio:', id);
      
      const negocio = negocios.find(function (n) { return n.id === id; });
      if (!negocio) { 
        console.error('❌ Negocio no encontrado:', id);
        mostrarToast('Negocio no encontrado', 'error'); 
        return; 
      }

      console.log('📋 Datos del negocio a editar:', negocio);

      document.getElementById('modalTitle').textContent = '✏️ Editar Negocio';
      document.getElementById('btnGuardar').textContent = '💾 Actualizar';
      document.getElementById('editId').value = id;

      document.getElementById('usuario').value = negocio.usuario || '';
      document.getElementById('password').value = negocio.password || '';
      document.getElementById('nombre').value = negocio.nombre || '';
      document.getElementById('slogan').value = negocio.slogan || '';
      document.getElementById('descripcion').value = negocio.descripcion || '';
      document.getElementById('ubicacion').value = negocio.ubicacion || '';
      document.getElementById('direccion').value = negocio.direccion || '';
      document.getElementById('telefono').value = negocio.telefono || '';
      document.getElementById('whatsapp').value = negocio.whatsapp || '';
      document.getElementById('correo').value = negocio.correo || '';
      document.getElementById('horario').value = negocio.horario || '';
      document.getElementById('rol').value = negocio.rol || 'Admin';
      document.getElementById('urlFacebook').value = negocio.urlFacebook || '';
      document.getElementById('activo').value = negocio.activo ? 'true' : 'false';

      // Cargar fotos existentes
      fotosActuales = [null, null, null, null];
      if (negocio.fotos && Array.isArray(negocio.fotos)) {
        negocio.fotos.forEach(function (f, i) { 
          if (i < 4 && f && f.url) {
            fotosActuales[i] = { url: f.url, descripcion: f.descripcion || '' }; 
          }
        });
      }
      
      console.log('🖼️ Fotos cargadas:', fotosActuales.filter(f => f).length);
      renderizarSlotsFotos();
      document.getElementById('modal').classList.add('active');
    }

    function cerrarModal() { 
      document.getElementById('modal').classList.remove('active'); 
      console.log('🔒 Modal cerrado');
    }

    // ============================================================
    // GUARDAR
    // ============================================================
    function guardarNegocio(event) {
      event.preventDefault();
      const editId = document.getElementById('editId').value;
      
      console.log('💾 Guardando negocio...', editId ? '(Edición: ' + editId + ')' : '(Nuevo)');

      const datos = {
        usuario: document.getElementById('usuario').value.trim(),
        password: document.getElementById('password').value.trim(),
        nombre: document.getElementById('nombre').value.trim(),
        slogan: document.getElementById('slogan').value.trim(),
        descripcion: document.getElementById('descripcion').value.trim(),
        ubicacion: document.getElementById('ubicacion').value.trim(),
        direccion: document.getElementById('direccion').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        horario: document.getElementById('horario').value.trim(),
        rol: document.getElementById('rol').value,
        urlFacebook: document.getElementById('urlFacebook').value.trim(),
        activo: document.getElementById('activo').value === 'true',
        fotos: fotosActuales.filter(function (f) { return f && f.url && f.url.trim() !== ''; })
      };

      // Validaciones
      if (!datos.usuario || !datos.password || !datos.nombre) {
        mostrarToast('❌ Los campos Usuario, Contraseña y Nombre son obligatorios', 'error');
        return;
      }

      console.log('📤 Datos a enviar:', {
        ...datos,
        password: '***', // No mostrar contraseña en logs
        fotos: datos.fotos.length + ' foto(s)'
      });

      const btnGuardar = document.getElementById('btnGuardar');
      btnGuardar.disabled = true;
      btnGuardar.textContent = '⏳ Guardando...';

      const runner = editId ? 
        google.script.run.editarNegocio(editId, datos) : 
        google.script.run.agregarNegocio(datos);

      runner
        .withSuccessHandler(function (result) {
          btnGuardar.disabled = false;
          btnGuardar.textContent = '💾 Guardar';
          
          console.log('✅ Respuesta del servidor:', result);
          
          if (result.success) {
            mostrarToast(editId ? '✅ Negocio actualizado correctamente' : '✅ Negocio creado correctamente', 'success');
            cerrarModal();
            cargarNegocios();
          } else {
            console.error('❌ Error del servidor:', result.error);
            mostrarToast('❌ Error: ' + result.error, 'error');
          }
        })
        .withFailureHandler(function (error) {
          btnGuardar.disabled = false;
          btnGuardar.textContent = '💾 Guardar';
          console.error('❌ Error de conexión:', error);
          mostrarToast('❌ Error de conexión: ' + error.message, 'error');
        });
    }

    // ============================================================
    // ELIMINAR
    // ============================================================
    function eliminarNegocio(id) {
      console.log('🗑️ Solicitando eliminar negocio:', id);
      
      if (!confirm('⚠️ ¿Estás seguro de eliminar este negocio?\n\nEsta acción no se puede deshacer.')) {
        console.log('❌ Eliminación cancelada por el usuario');
        return;
      }
      
      google.script.run
        .withSuccessHandler(function (result) {
          console.log('✅ Respuesta de eliminación:', result);
          
          if (result.success) { 
            mostrarToast('✅ Negocio eliminado correctamente', 'success'); 
            cargarNegocios(); 
          } else {
            console.error('❌ Error al eliminar:', result.error);
            mostrarToast('❌ Error: ' + result.error, 'error'); 
          }
        })
        .withFailureHandler(function (error) { 
          console.error('❌ Error de conexión al eliminar:', error);
          mostrarToast('❌ Error de conexión: ' + error.message, 'error'); 
        })
        .eliminarNegocio(id);
    }

    // ============================================================
    // TOAST
    // ============================================================
    function mostrarToast(mensaje, tipo) {
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + (tipo || 'success');
      toast.textContent = mensaje;
      document.body.appendChild(toast);
      
      // Animación de entrada
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100px)';
      toast.style.transition = 'all 0.3s ease';
      
      setTimeout(function() {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(0)';
      }, 10);
      
      // Eliminar después de 3 segundos
      setTimeout(function () { 
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100px)';
        setTimeout(function() { toast.remove(); }, 300);
      }, 3000);
    }

    // ============================================================
    // DEBUG - Consola
    // ============================================================
    console.log('🚀 Aplicación de Gestión de Negocios inicializada');
    console.log('📋 Funciones disponibles: cargarNegocios, abrirModalAgregar, abrirModalEditar, eliminarNegocio');
  </script>
</body>
</html>
