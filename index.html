<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Negocios</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 600;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5a6fd6;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: #28a745;
      color: white;
    }
    
    .btn-success:hover {
      background: #218838;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    
    .btn-danger:hover {
      background: #c82333;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
    }
    
    .btn-warning {
      background: #ffc107;
      color: #333;
    }
    
    .btn-warning:hover {
      background: #e0a800;
      transform: translateY(-2px);
    }
    
    .btn-outline {
      background: transparent;
      border: 2px solid white;
      color: white;
    }
    
    .btn-outline:hover {
      background: white;
      color: #667eea;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .stat-card {
      background: white;
      padding: 18px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .stat-card .number {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    
    .stat-card .label {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }
    
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .search-box {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 400px;
    }
    
    .search-box input {
      flex: 1;
      padding: 10px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    .search-box input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .negocios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }
    
    .negocio-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
    }
    
    .negocio-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }
    
    .negocio-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e9ecef;
    }
    
    .negocio-header .id {
      font-size: 12px;
      color: #888;
      font-weight: 600;
    }
    
    .negocio-header .status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .status-active {
      background: #d4edda;
      color: #155724;
    }
    
    .status-inactive {
      background: #f8d7da;
      color: #721c24;
    }
    
    .negocio-body {
      padding: 16px 20px;
    }
    
    .negocio-body .nombre {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    
    .negocio-body .slogan {
      font-size: 14px;
      color: #667eea;
      font-weight: 500;
    }
    
    .negocio-body .descripcion {
      font-size: 14px;
      color: #555;
      margin: 10px 0 12px 0;
      line-height: 1.5;
    }
    
    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #666;
      margin: 4px 0;
    }
    
    .info-row .icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
    }
    
    .fotos-preview {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    
    .fotos-preview img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #e9ecef;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .fotos-preview img:hover {
      transform: scale(1.05);
    }
    
    .negocio-footer {
      padding: 12px 20px;
      border-top: 1px solid #e9ecef;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: #fafafa;
    }
    
    .negocio-footer .btn {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      font-size: 12px;
      justify-content: center;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    
    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: white;
      max-width: 700px;
      width: 100%;
      border-radius: 16px;
      padding: 30px;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn 0.3s ease;
    }
    
    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .modal-header h2 {
      font-size: 24px;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #999;
      transition: color 0.3s;
    }
    
    .modal-close:hover {
      color: #333;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      color: #444;
    }
    
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .form-group textarea {
      min-height: 60px;
      resize: vertical;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
      border-top: 1px solid #e9ecef;
      padding-top: 20px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 16px 28px;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      z-index: 2000;
      animation: slideUp 0.4s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    
    .toast-success {
      background: #28a745;
    }
    
    .toast-error {
      background: #dc3545;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .negocios-grid {
        grid-template-columns: 1fr;
      }
      
      .search-box {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Header -->
    <div class="header">
      <h1>🏪 Gestión de Negocios</h1>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="cargarNegocios()">🔄 Recargar</button>
        <button class="btn btn-success" onclick="abrirModalAgregar()">➕ Nuevo Negocio</button>
      </div>
    </div>
    
    <!-- Stats -->
    <div class="stats-grid" id="stats"></div>
    
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar negocio..." oninput="filtrarNegocios()">
      </div>
      <span id="contador" style="font-size:14px;color:#888;"></span>
    </div>
    
    <!-- Grid de Negocios -->
    <div id="negociosGrid" class="negocios-grid">
      <div class="loading">
        <div class="spinner"></div>
        <p>Cargando negocios...</p>
      </div>
    </div>
  </div>
  
  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo Negocio</h2>
        <button class="modal-close" onclick="cerrarModal()">&times;</button>
      </div>
      <form id="formNegocio" onsubmit="guardarNegocio(event)">
        <input type="hidden" id="editId" value="">
        
        <div class="form-row">
          <div class="form-group">
            <label>Usuario *</label>
            <input type="text" id="usuario" required>
          </div>
          <div class="form-group">
            <label>Contraseña *</label>
            <input type="text" id="password" required>
          </div>
        </div>
        
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" id="nombre" required>
        </div>
        
        <div class="form-group">
          <label>Slogan</label>
          <input type="text" id="slogan">
        </div>
        
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descripcion"></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Ubicación</label>
            <input type="text" id="ubicacion">
          </div>
          <div class="form-group">
            <label>Dirección</label>
            <input type="text" id="direccion">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Teléfono</label>
            <input type="text" id="telefono">
          </div>
          <div class="form-group">
            <label>WhatsApp</label>
            <input type="text" id="whatsapp">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Correo</label>
            <input type="email" id="correo">
          </div>
          <div class="form-group">
            <label>Horario</label>
            <input type="text" id="horario" placeholder="Ej: 9:00 a 6">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Rol</label>
            <select id="rol">
              <option value="Admin">Admin</option>
              <option value="Usuario">Usuario</option>
              <option value="Supervisor">Supervisor</option>
            </select>
          </div>
          <div class="form-group">
            <label>URL Facebook</label>
            <input type="text" id="urlFacebook" placeholder="https://facebook.com/...">
          </div>
        </div>
        
        <div class="form-group">
          <label>Activo</label>
          <select id="activo">
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn btn-warning" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardar">💾 Guardar</button>
        </div>
      </form>
    </div>
  </div>
  
  <script>
    let negocios = [];
    let shaActual = '';
    let filtro = '';
    
    // ============================================================
    // CARGA INICIAL
    // ============================================================
    window.onload = function() {
      cargarNegocios();
    };
    
    // ============================================================
    // FUNCIONES DE CARGA Y RENDERIZADO
    // ============================================================
    function cargarNegocios() {
      const grid = document.getElementById('negociosGrid');
      grid.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando negocios...</p>
        </div>
      `;
      
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result.success) {
            mostrarToast('Error al cargar: ' + result.error, 'error');
            grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Error al cargar los negocios</p></div>`;
            return;
          }
          negocios = result.negocios || [];
          shaActual = result.sha || '';
          renderizarNegocios();
          actualizarEstadisticas();
        })
        .withFailureHandler(function(error) {
          mostrarToast('Error: ' + error.message, 'error');
        })
        .obtenerNegocios();
    }
    
    function renderizarNegocios() {
      const grid = document.getElementById('negociosGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const filtrados = negocios.filter(n => 
        (n.nombre || '').toLowerCase().includes(searchTerm) ||
        (n.id || '').toLowerCase().includes(searchTerm) ||
        (n.slogan || '').toLowerCase().includes(searchTerm) ||
        (n.direccion || '').toLowerCase().includes(searchTerm)
      );
      
      document.getElementById('contador').textContent = `${filtrados.length} de ${negocios.length} negocios`;
      
      if (filtrados.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="icon">📭</div>
            <p>No se encontraron negocios</p>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="abrirModalAgregar()">➕ Crear uno</button>
          </div>
        `;
        return;
      }
      
      grid.innerHTML = filtrados.map((n, index) => `
        <div class="negocio-card">
          <div class="negocio-header">
            <span class="id">${n.id || 'Sin ID'}</span>
            <span class="status ${n.activo ? 'status-active' : 'status-inactive'}">
              ${n.activo ? '✅ Activo' : '❌ Inactivo'}
            </span>
          </div>
          <div class="negocio-body">
            <div class="nombre">${n.nombre || 'Sin nombre'}</div>
            <div class="slogan">${n.slogan || ''}</div>
            <div class="descripcion">${n.descripcion || ''}</div>
            
            <div class="info-row"><span class="icon">📍</span> ${n.direccion || 'Sin dirección'}</div>
            <div class="info-row"><span class="icon">📞</span> ${n.telefono || 'Sin teléfono'}</div>
            <div class="info-row"><span class="icon">⏰</span> ${n.horario || 'Sin horario'}</div>
            <div class="info-row"><span class="icon">👤</span> ${n.rol || 'Sin rol'} | ${n.usuario || 'Sin usuario'}</div>
            
            ${n.fotos && n.fotos.length > 0 ? `
              <div class="fotos-preview">
                ${n.fotos.slice(0, 4).map(f => `
                  <img src="${f.url}" alt="${f.descripcion || 'Imagen'}" title="${f.descripcion || 'Imagen'}" onclick="window.open('${f.url}')">
                `).join('')}
                ${n.fotos.length > 4 ? `<span style="font-size:13px;color:#888;align-self:center;">+${n.fotos.length - 4}</span>` : ''}
              </div>
            ` : ''}
          </div>
          <div class="negocio-footer">
            <button class="btn btn-primary" onclick="abrirModalEditar('${n.id}')">✏️ Editar</button>
            <button class="btn btn-danger" onclick="eliminarNegocio('${n.id}')">🗑️ Eliminar</button>
          </div>
        </div>
      `).join('');
    }
    
    function filtrarNegocios() {
      renderizarNegocios();
    }
    
    // ============================================================
    // ESTADÍSTICAS
    // ============================================================
    function actualizarEstadisticas() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result.success) return;
          const stats = result.estadisticas;
          document.getElementById('stats').innerHTML = `
            <div class="stat-card"><div class="number">${stats.total}</div><div class="label">Total Negocios</div></div>
            <div class="stat-card"><div class="number">${stats.activos}</div><div class="label">Activos</div></div>
            <div class="stat-card"><div class="number">${stats.inactivos}</div><div class="label">Inactivos</div></div>
            <div class="stat-card"><div class="number">${stats.ubicacionesUnicas}</div><div class="label">Ubicaciones Únicas</div></div>
          `;
        })
        .obtenerEstadisticas();
    }
    
    // ============================================================
    // MODAL
    // ============================================================
    function abrirModalAgregar() {
      document.getElementById('modalTitle').textContent = '➕ Nuevo Negocio';
      document.getElementById('btnGuardar').textContent = '💾 Guardar';
      document.getElementById('editId').value = '';
      document.getElementById('formNegocio').reset();
      document.getElementById('activo').value = 'true';
      document.getElementById('modal').classList.add('active');
    }
    
    function abrirModalEditar(id) {
      const negocio = negocios.find(n => n.id === id);
      if (!negocio) {
        mostrarToast('Negocio no encontrado', 'error');
        return;
      }
      
      document.getElementById('modalTitle').textContent = '✏️ Editar Negocio';
      document.getElementById('btnGuardar').textContent = '💾 Actualizar';
      document.getElementById('editId').value = id;
      
      document.getElementById('usuario').value = negocio.usuario || '';
      document.getElementById('password').value = negocio.password || '';
      document.getElementById('nombre').value = negocio.nombre || '';
      document.getElementById('slogan').value = negocio.slogan || '';
      document.getElementById('descripcion').value = negocio.descripcion || '';
      document.getElementById('ubicacion').value = negocio.ubicacion || '';
      document.getElementById('direccion').value = negocio.direccion || '';
      document.getElementById('telefono').value = negocio.telefono || '';
      document.getElementById('whatsapp').value = negocio.whatsapp || '';
      document.getElementById('correo').value = negocio.correo || '';
      document.getElementById('horario').value = negocio.horario || '';
      document.getElementById('rol').value = negocio.rol || 'Admin';
      document.getElementById('urlFacebook').value = negocio.urlFacebook || '';
      document.getElementById('activo').value = negocio.activo ? 'true' : 'false';
      
      document.getElementById('modal').classList.add('active');
    }
    
    function cerrarModal() {
      document.getElementById('modal').classList.remove('active');
    }
    
    // ============================================================
    // GUARDAR NEGOCIO
    // ============================================================
    function guardarNegocio(event) {
      event.preventDefault();
      
      const editId = document.getElementById('editId').value;
      const datos = {
        usuario: document.getElementById('usuario').value.trim(),
        password: document.getElementById('password').value.trim(),
        nombre: document.getElementById('nombre').value.trim(),
        slogan: document.getElementById('slogan').value.trim(),
        descripcion: document.getElementById('descripcion').value.trim(),
        ubicacion: document.getElementById('ubicacion').value.trim(),
        direccion: document.getElementById('direccion').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        horario: document.getElementById('horario').value.trim(),
        rol: document.getElementById('rol').value,
        urlFacebook: document.getElementById('urlFacebook').value.trim(),
        activo: document.getElementById('activo').value === 'true',
        fotos: [],
        etiquetas: []
      };
      
      if (!datos.usuario || !datos.password || !datos.nombre) {
        mostrarToast('Los campos Usuario, Contraseña y Nombre son obligatorios', 'error');
        return;
      }
      
      const funcion = editId ? 'editarNegocio' : 'agregarNegocio';
      const parametro = editId ? [editId, datos] : [datos];
      
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            mostrarToast(editId ? '✅ Negocio actualizado' : '✅ Negocio creado', 'success');
            cerrarModal();
            cargarNegocios();
          } else {
            mostrarToast('Error: ' + result.error, 'error');
          }
        })
        .withFailureHandler(function(error) {
          mostrarToast('Error: ' + error.message, 'error');
        })
        [funcion].apply(null, parametro);
    }
    
    // ============================================================
    // ELIMINAR NEGOCIO
    // ============================================================
    function eliminarNegocio(id) {
      if (!confirm('¿Estás seguro de eliminar este negocio? Esta acción no se puede deshacer.')) return;
      
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            mostrarToast('✅ Negocio eliminado', 'success');
            cargarNegocios();
          } else {
            mostrarToast('Error: ' + result.error, 'error');
          }
        })
        .withFailureHandler(function(error) {
          mostrarToast('Error: ' + error.message, 'error');
        })
        .eliminarNegocio(id);
    }
    
    // ============================================================
    // TOAST
    // ============================================================
    function mostrarToast(mensaje, tipo = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${tipo}`;
      toast.textContent = mensaje;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }
  </script>
</body>
</html>
