<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Generando Landing...</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0E17;color:#E0E0E0;font-family:'Segoe UI',system-ui,sans-serif}

#previewFrame{position:fixed;inset:0;width:100%;height:100%;border:none;background:#fff;z-index:1}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(10,14,23,0.95) 0%,rgba(10,14,23,0) 100%);display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;transition:opacity .3s}
.topbar > *{pointer-events:auto}
.topbar.hidden{opacity:0;pointer-events:none}
.badge{background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);color:#00D4FF;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(0,212,255,0.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.actions{display:flex;gap:6px}
.btn{padding:9px 14px;border:none;border-radius:20px;cursor:pointer;font-weight:700;font-size:12px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn:active{transform:scale(0.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.btn-success{background:#00FF88;color:#0A0E17;box-shadow:0 0 15px rgba(0,255,136,0.5)}
.btn-danger{background:#FF0040;color:#fff}

.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(10,14,23,0.95) 0%,rgba(10,14,23,0) 100%);display:flex;gap:6px;justify-content:center;overflow-x:auto;scrollbar-width:none;transition:opacity .3s}
.bottombar::-webkit-scrollbar{display:none}
.bottombar.hidden{opacity:0;pointer-events:none}
.plantilla-btn{background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border:1px solid rgba(0,212,255,0.3);color:#00D4FF;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .2s;font-family:inherit}
.plantilla-btn.activa{background:#00D4FF;color:#0A0E17;border-color:#00D4FF;box-shadow:0 0 20px rgba(0,212,255,0.5)}

.fab-toggle{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:16px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);color:#00D4FF;border:1px solid rgba(0,212,255,0.4);font-size:20px;cursor:pointer;z-index:101;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab-toggle:active{transform:scale(0.9)}

.loading{position:fixed;inset:0;background:rgba(10,14,23,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(8px);transition:opacity .3s}
.loading.hide{opacity:0;pointer-events:none}
.spinner{width:52px;height:52px;border:4px solid #1A1A2E;border-top-color:#00D4FF;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;box-shadow:0 0 30px rgba(0,212,255,0.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#00D4FF;font-weight:700;font-size:14px;text-align:center;padding:0 20px;max-width:340px;line-height:1.5}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:12px;color:#fff;font-weight:600;font-size:13px;z-index:10000;box-shadow:0 8px 30px rgba(0,0,0,0.5);max-width:90vw;text-align:center;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-success{background:linear-gradient(135deg,#00FF88,#00D4FF);color:#0A0E17}
.toast-error{background:linear-gradient(135deg,#FF0040,#FF00E5)}
.toast-info{background:rgba(0,0,0,0.9);border:1px solid #00D4FF;color:#00D4FF}

/* ===== MODAL DE LINK FINAL ===== */
.link-modal{position:fixed;inset:0;background:rgba(10,14,23,0.95);backdrop-filter:blur(8px);z-index:11000;display:none;align-items:center;justify-content:center;padding:20px}
.link-modal.show{display:flex}
.link-modal-inner{background:#1A1A2E;border:2px solid #00FF88;border-radius:20px;padding:28px 24px;max-width:480px;width:100%;box-shadow:0 0 60px rgba(0,255,136,0.4);animation:popIn .3s ease}
@keyframes popIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.link-modal-inner h2{color:#00FF88;font-size:20px;margin-bottom:8px;text-align:center}
.link-modal-inner p{color:#AAA;font-size:13px;text-align:center;margin-bottom:20px}
.link-modal-inner .link-box{background:#0D1117;border:2px solid #2A2A4A;border-radius:10px;padding:14px;font-family:monospace;font-size:13px;color:#00D4FF;word-break:break-all;margin-bottom:16px;text-align:center;line-height:1.5}
.link-modal-inner .link-actions{display:flex;flex-direction:column;gap:10px}
.link-modal-inner .link-actions a,.link-modal-inner .link-actions button{padding:14px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;text-align:center;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px}
.link-modal-inner .btn-abrir{background:#00D4FF;color:#0A0E17}
.link-modal-inner .btn-copiar{background:#7B2FF7;color:#fff}
.link-modal-inner .btn-whatsapp{background:#25D366;color:#fff}
.link-modal-inner .btn-cerrar-modal{background:#2A2A4A;color:#E0E0E0}

@media (max-width:480px){
  .badge{font-size:10px;padding:5px 10px}
  .btn{padding:8px 10px;font-size:11px;min-height:36px}
  .plantilla-btn{padding:8px 12px;font-size:11px}
  .fab-toggle{width:40px;height:40px;font-size:18px;bottom:calc(64px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p class="loading-text" id="loadingText">Preparando vista previa...</p>
</div>

<iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals"></iframe>

<div class="topbar" id="topbar">
  <span class="badge" id="previewBadge">👁️ Vista Previa</span>
  <div class="actions">
    <button class="btn btn-ghost" id="btnDescargar" title="Descargar HTML">⬇️</button>
    <button class="btn btn-success" id="btnPublicar" title="Publicar en GitHub">🚀 Publicar</button>
    <button class="btn btn-danger" id="btnCerrar" title="Cerrar">✖</button>
  </div>
</div>

<div class="bottombar" id="bottombar">
  <button class="plantilla-btn" data-plantilla="futurista" onclick="cambiarPlantilla('futurista')">⚡ Futurista</button>
  <button class="plantilla-btn" data-plantilla="minimalista" onclick="cambiarPlantilla('minimalista')">◻️ Minimalista</button>
  <button class="plantilla-btn" data-plantilla="clasico" onclick="cambiarPlantilla('clasico')">🏛️ Clásico</button>
</div>

<button class="fab-toggle" id="fabToggle" onclick="toggleBarras()">👁️</button>

<!-- Modal de link final -->
<div class="link-modal" id="linkModal">
  <div class="link-modal-inner">
    <h2>✅ ¡Publicado en GitHub!</h2>
    <p id="linkModalSub">Tu landing ya está en línea</p>
    <div class="link-box" id="linkBox">https://...</div>
    <div class="link-actions">
      <a href="#" target="_blank" rel="noopener" class="btn-abrir" id="linkAbrir">🌐 Abrir landing</a>
      <button class="btn-copiar" id="linkCopiar">📋 Copiar link</button>
      <a href="#" target="_blank" rel="noopener" class="btn-whatsapp" id="linkCompartir">💬 Compartir en WhatsApp</a>
      <button class="btn-cerrar-modal" id="linkCerrar">Cerrar</button>
    </div>
  </div>
</div>

<iframe name="hiddenSaveFrame" style="display:none"></iframe>
<form id="hiddenSaveForm" method="POST" target="hiddenSaveFrame" style="display:none">
  <input type="hidden" name="action" id="hf_action">
  <input type="hidden" name="id" id="hf_id">
  <input type="hidden" name="datos" id="hf_datos">
</form>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const GITHUB_PUBLISH_URL = 'https://script.google.com/macros/s/AKfycbwh4EBEepNZrWVibk7L4jq3KZHx9ly_tFsF7OjFDInt6GS-gjdiQcWVrd83tzLNp-aKSw/exec';
const GOOGLE_VERIFICATION = 'o7Qk58AlI2FmeW05yL8c0p5epUhBa8rBgb6ldSqReOo';
const GITHUB_USER = 'proyectosolaronline';
const GITHUB_PAGES_BASE = `https://${GITHUB_USER}.github.io`;

let negocioActual = null;
let currentPreviewHTML = '';
let currentPreviewNombre = '';
let currentPreviewSlug = '';
let plantillaActual = 'futurista';
let barrasVisibles = true;
let urlPublicada = '';

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  let datos = null;
  try {
    const raw = localStorage.getItem('landingData');
    if (raw) datos = JSON.parse(raw);
  } catch(e) {}

  if (!datos) {
    const params = new URLSearchParams(window.location.search);
    const b64 = params.get('datos');
    if (b64) {
      try { datos = JSON.parse(decodeURIComponent(escape(atob(b64)))); } catch(e) {}
    }
  }

  if (!datos || !datos.nombre) {
    document.getElementById('loadingText').innerHTML = '❌ No se recibieron datos.<br><br>Abre esta página desde el sistema de gestión.';
    document.getElementById('loadingText').style.color = '#FF0040';
    document.getElementById('fabToggle').style.display = 'none';
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('bottombar').style.display = 'none';
    return;
  }

  if (!datos.logo || !datos.banner) {
    document.getElementById('loadingText').innerHTML = '❌ Faltan datos obligatorios.<br><br>El negocio debe tener <strong>logo</strong> y <strong>banner</strong>.';
    document.getElementById('loadingText').style.color = '#FF0040';
    document.getElementById('fabToggle').style.display = 'none';
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('bottombar').style.display = 'none';
    return;
  }

  negocioActual = datos;
  document.getElementById('previewBadge').textContent = '👁️ ' + (datos.nombre || 'Vista Previa');
  plantillaActual = datos.plantillaLanding || 'futurista';
  regenerarLanding();

  setTimeout(() => { document.getElementById('loading').classList.add('hide'); }, 500);
  setTimeout(() => { if (barrasVisibles) toggleBarras(); }, 4000);
});

// ============================================================
// REGENERAR LANDING
// ============================================================
function regenerarLanding() {
  if (!negocioActual) return;
  currentPreviewHTML = construirLandingHTML(negocioActual, plantillaActual);
  currentPreviewSlug = slugify(negocioActual.nombre);
  currentPreviewNombre = currentPreviewSlug + '.html';
  document.getElementById('previewFrame').srcdoc = currentPreviewHTML;
  actualizarBotonesPlantilla(plantillaActual);
}

// ============================================================
// UTILIDADES
// ============================================================
function slugify(str) {
  return String(str || 'negocio')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

function mostrarToast(msg, tipo) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast toast-' + (tipo || 'success');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3200);
}

function toggleBarras() {
  barrasVisibles = !barrasVisibles;
  const top = document.getElementById('topbar');
  const bot = document.getElementById('bottombar');
  const fab = document.getElementById('fabToggle');
  if (barrasVisibles) {
    top.classList.remove('hidden');
    bot.classList.remove('hidden');
    fab.textContent = '👁️';
  } else {
    top.classList.add('hidden');
    bot.classList.add('hidden');
    fab.textContent = '⚙️';
  }
}

function cambiarPlantilla(p) {
  plantillaActual = p;
  regenerarLanding();
  mostrarToast('🎭 Plantilla: ' + p, 'info');
}

function actualizarBotonesPlantilla(activa) {
  document.querySelectorAll('.plantilla-btn').forEach(b => {
    b.classList.toggle('activa', b.dataset.plantilla === activa);
  });
}

// ============================================================
// BOTONES
// ============================================================
document.getElementById('btnCerrar').onclick = () => {
  try { localStorage.removeItem('landingData'); } catch(e) {}
  window.close();
  setTimeout(() => { window.location.href = 'about:blank'; }, 200);
};

document.getElementById('btnDescargar').onclick = () => {
  if (!currentPreviewHTML) { mostrarToast('⚠️ No hay landing generada', 'error'); return; }
  const blob = new Blob([currentPreviewHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentPreviewNombre;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  mostrarToast('✅ HTML descargado', 'success');
};

document.getElementById('btnPublicar').onclick = () => {
  if (!currentPreviewHTML || !negocioActual) {
    mostrarToast('⚠️ Primero genera la landing', 'error');
    return;
  }
  const slug = currentPreviewSlug;
  const sitemap = `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>${GITHUB_PAGES_BASE}/${slug}/</loc>
    <lastmod>${new Date().toISOString().split('T')[0]}</lastmod>
    <changefreq>weekly</changefreq>
    <priority>1.0</priority>
  </url>
</urlset>`;

  const btn = document.getElementById('btnPublicar');
  btn.disabled = true;
  btn.textContent = '⏳ Publicando...';
  document.getElementById('loadingText').textContent = 'Publicando en GitHub...';
  document.getElementById('loading').classList.remove('hide');

  const datos = {
    nombreArchivo: currentPreviewNombre,
    html: currentPreviewHTML,
    sitemap: sitemap,
    nombreSitemap: 'sitemap.xml',
    slug: slug,
    nombreNegocio: negocioActual.nombre || ''
  };

  function onMessage(e) {
    if (e.data && typeof e.data === 'object' && 'success' in e.data) {
      window.removeEventListener('message', onMessage);
      document.getElementById('loading').classList.add('hide');
      btn.disabled = false;
      btn.textContent = '🚀 Publicar';
      if (e.data.success) {
        urlPublicada = (e.data.url || (GITHUB_PAGES_BASE + '/' + slug + '/')).trim();
        mostrarToast('🚀 Publicado correctamente', 'success');
        mostrarModalLink(urlPublicada, negocioActual.nombre || '');
      } else {
        mostrarToast('❌ Error: ' + (e.data.error || 'desconocido'), 'error');
      }
    }
  }
  window.addEventListener('message', onMessage);

  document.getElementById('hf_action').value = 'publicarGitHub';
  document.getElementById('hf_id').value = '';
  document.getElementById('hf_datos').value = JSON.stringify(datos);
  const form = document.getElementById('hiddenSaveForm');
  form.action = GITHUB_PUBLISH_URL;
  form.submit();

  setTimeout(() => {
    window.removeEventListener('message', onMessage);
    if (!document.getElementById('loading').classList.contains('hide')) {
      document.getElementById('loading').classList.add('hide');
      btn.disabled = false;
      btn.textContent = '🚀 Publicar';
      mostrarToast('⚠️ Tiempo de espera agotado', 'error');
    }
  }, 30000);
};

// ============================================================
// MODAL DE LINK FINAL
// ============================================================
function mostrarModalLink(url, nombre) {
  document.getElementById('linkBox').textContent = url;
  document.getElementById('linkModalSub').textContent = nombre ? 'Landing de "' + nombre + '"' : 'Tu landing está en línea';
  document.getElementById('linkAbrir').href = url;
  document.getElementById('linkCompartir').href = 'https://wa.me/?text=' + encodeURIComponent('Mira la landing de ' + (nombre || 'nuestro negocio') + ': ' + url);
  document.getElementById('linkModal').classList.add('show');
}

document.getElementById('linkCerrar').onclick = () => {
  document.getElementById('linkModal').classList.remove('show');
};

document.getElementById('linkCopiar').onclick = async () => {
  try {
    await navigator.clipboard.writeText(urlPublicada);
    mostrarToast('📋 Link copiado', 'success');
  } catch(e) {
    mostrarToast('⚠️ No se pudo copiar', 'error');
  }
};

document.getElementById('linkModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('linkModal').classList.remove('show');
});

// ============================================================
// CONSTRUIR LANDING — FULL-BLEED + SEO
// ============================================================
function construirLandingHTML(n, plantillaOverride) {
  const plantilla = plantillaOverride || n.plantillaLanding || 'futurista';
  const whatsappDigits = String(n.whatsapp || '').replace(/\D/g, '');
  const telDigits = String(n.telefono || '').replace(/\D/g, '');
  const duenoWhatsappDigits = String(n.duenoTelefono || '').replace(/\D/g, '');
  const fotos = (n.fotos || []).filter(f => f && f.url);
  const tieneMapa = n.latitud && n.longitud;
  const colorPrimario = n.colorPrimario || '#7B2FF7';
  const colorSecundario = n.colorSecundario || '#FF00E5';
  const colorAcento = n.colorAcento || '#00D4FF';
  const fuenteLanding = n.fuenteLanding || "'Segoe UI',system-ui,sans-serif";
  const descParts = (n.descripcion || '').split('&');
  const descCorta = descParts[0].trim() || '';
  const descLarga = descParts[1] ? descParts[1].trim() : descCorta;

  const seoTitle = (`${n.nombre||'Negocio'}${n.slogan ? ' - ' + n.slogan : ''}`).substring(0, 65);
  const seoDescription = (descLarga || descCorta || `${n.nombre||'Negocio'} en ${n.direccion||n.ubicacion||'México'}`).replace(/\s+/g, ' ').substring(0, 158);
  const seoSlug = slugify(n.nombre);
  const ogImage = n.banner || n.logo || '';
  const canonicalUrl = `${GITHUB_PAGES_BASE}/${seoSlug}/`;

  const LIMITE = 90;
  const galeriaHTML = fotos.length ? `
    <section class="gallery">${fotos.map((f, i) => {
      const partes = (f.descripcion || '').split('&');
      const titulo = partes[0].trim() || '📸 Foto';
      const dLarga = partes[1] ? partes[1].trim() : '';
      let dc = dLarga, dr = '';
      if (dLarga.length > LIMITE) {
        let corte = dLarga.lastIndexOf(' ', LIMITE);
        if (corte === -1) corte = LIMITE;
        dc = dLarga.substring(0, corte);
        dr = dLarga.substring(corte);
      }
      return `<div class="gallery-item"><img src="${f.url}" alt="${titulo}" loading="lazy" onclick="lOpenLightbox(${i})"><div class="gallery-info"><div class="gallery-titulo">${titulo}</div>${dLarga ? `<p class="gallery-desc"><span>${dc}</span><span id="lDescResto${i}" style="display:none;">${dr}</span>${dr ? `<button class="vermas-btn" onclick="lToggleDescFoto(${i})">Ver más</button>` : ''}</p>` : ''}</div></div>`;
    }).join('')}</section>` : '';

  let urlExternaHTML = '';
  const uext = n.Urlexterna || n.urlexterna || '';
  if (uext.trim()) {
    let sep = uext.indexOf('&'); if (sep === -1) sep = uext.indexOf('|'); if (sep === -1) sep = uext.indexOf(';');
    if (sep !== -1) {
      const nombreExt = uext.substring(0, sep).trim();
      let urlExt = uext.substring(sep + 1).trim();
      if (urlExt && !/^https?:/.test(urlExt)) urlExt = 'https://' + urlExt;
      if (/^https?:/.test(urlExt)) {
        urlExternaHTML = `<section class="section"><div class="externo-card"><h2>🔗 ${nombreExt || 'Enlace externo'}</h2><a href="${urlExt}" target="_blank" rel="noopener" class="externo-btn" style="background:linear-gradient(135deg,${colorPrimario},${colorSecundario})">🌐 Visitar ${nombreExt || 'sitio'}</a></div></section>`;
      }
    }
  }

  let videoEmbedUrl = '';
  if (n.video && n.video.trim()) {
    const link = n.video.trim();
    if (link.includes('/d/')) {
      const fid = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (fid) videoEmbedUrl = 'https://drive.google.com/file/d/' + fid[1] + '/preview';
    } else if (link.includes('youtube.com') || link.includes('youtu.be')) {
      const m = link.match(/(?:v=|youtu\.be\/|\/shorts\/|\/embed\/)([a-zA-Z0-9_-]{11})/);
      if (m) videoEmbedUrl = 'https://www.youtube.com/embed/' + m[1] + '?rel=0';
    } else videoEmbedUrl = link;
  }
  const videoHTML = videoEmbedUrl ? `<section class="section"><div class="video-card"><iframe src="${videoEmbedUrl}" allowfullscreen loading="lazy"></iframe></div></section>` : '';

  const mapaHTML = tieneMapa ? `<section class="section"><h2>📍 Encuéntranos</h2><div class="map-card"><iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${parseFloat(n.longitud)-0.006}%2C${parseFloat(n.latitud)-0.006}%2C${parseFloat(n.longitud)+0.006}%2C${parseFloat(n.latitud)+0.006}&layer=mapnik&marker=${n.latitud}%2C${n.longitud}"></iframe></div><p class="direccion">${n.direccion||n.ubicacion||''}</p></section>` : '';

  const contactoItems = [
    ['📞','Teléfono',n.telefono],
    ['💬','WhatsApp',n.whatsapp],
    ['🕐','Horario',n.horario],
    ['✉️','Correo',n.correo]
  ].filter(x => x[2]);

  const contactoBotones = `
    ${whatsappDigits?`<a href="https://wa.me/${whatsappDigits}" class="btn-link btn-whatsapp" target="_blank">💬 WhatsApp</a>`:''}
    ${telDigits?`<a href="tel:${telDigits}" class="btn-link btn-call">📞 Llamar</a>`:''}
    ${tieneMapa?`<a href="https://www.google.com/maps/dir/?api=1&destination=${n.latitud},${n.longitud}" class="btn-link btn-maps" target="_blank">🧭 Cómo llegar</a>`:''}
    ${n.urlFacebook?`<a href="${n.urlFacebook}" class="btn-link btn-facebook" target="_blank">📘 Facebook</a>`:''}`;

  const jsonLd = {
    "@context":"https://schema.org",
    "@type":"LocalBusiness",
    "name":n.nombre||'',
    "description":seoDescription,
    "image":ogImage,
    "logo":n.logo||'',
    "telephone":n.telefono||'',
    "email":n.correo||'',
    "url":canonicalUrl,
    "address":{"@type":"PostalAddress","streetAddress":n.direccion||'',"addressLocality":n.ubicacion||'',"addressCountry":"MX"},
    "openingHours":n.horario||'',
    ...(tieneMapa ? { "geo": { "@type": "GeoCoordinates", "latitude": n.latitud, "longitude": n.longitud } } : {}),
    ...(n.urlFacebook ? { "sameAs": [n.urlFacebook] } : {})
  };

  let overrides = '';
  if (plantilla === 'minimalista') {
    overrides = `body{background:#F4F5F7;color:#1E1E1E}.banner{background:${colorPrimario}!important;background-image:none!important}.banner-inner{background:rgba(0,0,0,0.15)}.slogan{color:${colorPrimario};font-style:normal}.contact-item{background:#F9F9FA}.contact-item .cv{color:#1E1E1E}.section h2{color:#1E1E1E}footer{background:#EFEFEF}`;
  } else if (plantilla === 'clasico') {
    overrides = `body{background:#F3ECDD;color:#3B2A1A}.banner-inner{background:linear-gradient(135deg,rgba(59,42,26,0.35),rgba(59,42,26,0.55))}.slogan{color:${colorAcento}}.contact-item{background:#FBF3E3}footer{background:#2A1D12}`;
  }

  const footerHTML = `<footer><p class="footer-nombre" style="color:${colorAcento}">⚡ ${n.nombre||''}</p><p class="footer-slogan">${n.slogan||'Gracias por visitarnos'}</p></footer>`;

  return `<!DOCTYPE html>
<html lang="es">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">

<meta name="robots" content="index, follow, max-image-preview:large">

<meta name="theme-color" content="${colorPrimario}">
<meta name="author" content="${n.nombre||''}">
<link rel="canonical" href="${canonicalUrl}">
<meta name="keywords" content="${n.nombre||''}, ${n.ubicacion||''}, ${n.horario||''}">
<meta property="og:type" content="business.business">
<meta property="og:title" content="${n.nombre||''}">
<meta property="og:description" content="${seoDescription}">
${ogImage?`<meta property="og:image" content="${ogImage}">`:''}
<meta property="og:url" content="${canonicalUrl}">
<meta property="og:site_name" content="${n.nombre||''}">
<meta property="og:locale" content="es_MX">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="${n.nombre||''}">
<meta name="twitter:description" content="${seoDescription}">
${ogImage?`<meta name="twitter:image" content="${ogImage}">`:''}
<script type="application/ld+json">${JSON.stringify(jsonLd)}<\/script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{font-family:${fuenteLanding};color:#E0E0E0;background:#0A0E17;line-height:1.6;padding:0;margin:0}

.banner{width:100%;background:linear-gradient(135deg,${colorPrimario} 0%,${colorSecundario} 100%);${n.banner?`background-image:url('${n.banner}');background-size:cover;background-position:center;background-repeat:no-repeat;`:''}}
.banner-inner{display:flex;align-items:center;gap:16px;padding:20px 16px;padding-top:calc(20px + env(safe-area-inset-top));background:linear-gradient(135deg,rgba(0,0,0,0.45),rgba(0,0,0,0.65));min-height:160px}
.banner-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid ${colorAcento};flex-shrink:0;box-shadow:0 0 25px ${colorAcento};background:#fff}
.banner-text h1{color:#fff;font-size:22px;font-weight:800;text-shadow:0 0 20px rgba(255,255,255,0.5);line-height:1.2}
.banner-text p{color:rgba(255,255,255,0.95);font-size:13px;margin-top:6px;font-weight:600}

.gallery-info{padding:10px 12px 12px}
.gallery-titulo{font-size:13px;font-weight:700;color:#E0E0E0}

.externo-btn{display:inline-block;padding:14px 30px;color:#fff;border-radius:12px;font-weight:700;text-decoration:none}

.video-card{position:relative;padding-bottom:56.25%;height:0;border-radius:14px;overflow:hidden;border:2px solid ${colorPrimario};background:#000}

.btns-group{display:flex;flex-direction:column;gap:10px;padding:24px 16px 0}

.qr-caption span{font-weight:700;color:${colorAcento};cursor:pointer}
.popup-msg{position:fixed;left:50%;bottom:-150px;transform:translateX(-50%);background:linear-gradient(135deg,${colorPrimario},${colorSecundario});color:#fff;padding:16px 44px 16px 22px;border-radius:14px 14px 0 0;font-size:14px;font-weight:600;text-align:center;max-width:92vw;z-index:4000;transition:bottom .5s ease;box-shadow:0 -4px 20px rgba(0,0,0,0.4)}
.popup-msg.mostrar{bottom:0}

footer{background:#000;text-align:center;padding:26px 16px;padding-bottom:calc(26px + env(safe-area-inset-bottom));font-size:14px;margin-top:24px}
footer .footer-nombre{font-weight:700;font-size:14px;margin-bottom:6px}
footer .footer-slogan{color:#888;font-size:12px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:5000;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lightbox.active{display:flex}
.lightbox img{max-width:100%;max-height:75vh;border-radius:12px;border:3px solid ${colorAcento}}
.lightbox-cap{color:#fff;font-size:14px;margin-top:16px;text-align:center;max-width:90vw}
.lightbox-back{margin-top:24px;background:${colorAcento};color:#0A0E17;border:none;padding:14px 30px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px}

  .contact-grid{grid-template-columns:1fr 1fr}
  .btns-group{flex-direction:row;flex-wrap:wrap}
  .btn-link{flex:1;min-width:140px}
}
${overrides}
</style></head><body>

<div class="banner"><div class="banner-inner">

  <div class="banner-text">
    <h1>${n.nombre||''}</h1>
    ${n.slogan?`<p>✨ ${n.slogan}</p>`:''}
  </div>
</div></div>

${n.slogan?`<p class="slogan">"${n.slogan}"</p>`:''}
${descLarga?`<p class="desc">${descLarga}</p>`:''}

</div>
${mapaHTML}
<div class="btns-group">${contactoBotones}</div>
<section class="qr-section">
  <img class="qr-img" id="lQrImg" alt="QR" onclick="compartirQR()">
  <p class="qr-caption"><span onclick="compartirQR()">📱 Escanea para compartir</span></p>
</section>
${footerHTML}

<div class="lightbox" id="lLightbox">
  <img id="lLightboxImg" src="" alt="">
  <p class="lightbox-cap" id="lLightboxCap"></p>
  <button class="lightbox-back" onclick="lCloseLightbox()">← Volver</button>
</div>

<script>
(function(){
  var lFotos = ${JSON.stringify(fotos)};
  window.lOpenLightbox = function(i){
    var f = lFotos[i]; if(!f) return;
    document.getElementById('lLightboxImg').src = f.url;
    var p = (f.descripcion||'').split('&');
    document.getElementById('lLightboxCap').textContent = p[1] ? p[1].trim() : (p[0].trim() || '📸');
    document.getElementById('lLightbox').classList.add('active');
  };
  window.lCloseLightbox = function(){
    document.getElementById('lLightbox').classList.remove('active');
  };
  window.lToggleDescFoto = function(i){
    var r = document.getElementById('lDescResto'+i);
    if(r) r.style.display = r.style.display==='none' ? 'inline' : 'none';
  };
  document.getElementById('lLightbox').addEventListener('click', function(e){
    if(e.target === this) lCloseLightbox();
  });
  var u = window.location.href;
  var q = document.getElementById('lQrImg');
  if(q) q.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(u);
  window.compartirQR = function(){
    window.open('https://wa.me/?text='+encodeURIComponent('${(String(n.nombre||'')).replace(/'/g,"\\'")}: '+u),'_blank');
  };
  var msg = '${(n.mensajeEmergente || n.slogan || '').replace(/'/g,"\\'")}';
  if(msg){
    var pop = document.createElement('div');
    pop.className = 'popup-msg';
    pop.innerHTML = '<span>✨ '+msg+'</span><button class="popup-cerrar">×</button>';
    document.body.appendChild(pop);
    function m(){ pop.classList.add('mostrar'); setTimeout(function(){ pop.classList.remove('mostrar'); },3000); }
    pop.querySelector('.popup-cerrar').onclick = function(){ pop.classList.remove('mostrar'); };
    setTimeout(m,2000);
    setInterval(m,15000);
  }
})();
<\/script>
</body></html>`;
}
</script>
